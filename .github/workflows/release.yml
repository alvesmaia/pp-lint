name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            asset: pp-lint-win-x64.exe
            binary: pp-lint.exe
          - os: ubuntu-latest
            rid: linux-x64
            asset: pp-lint-linux-x64
            binary: pp-lint
          - os: macos-latest
            rid: osx-arm64
            asset: pp-lint-osx-arm64
            binary: pp-lint
          - os: macos-13
            rid: osx-x64
            asset: pp-lint-osx-x64
            binary: pp-lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Testes
        run: dotnet test --configuration Release

      - name: Versão a partir da tag
        id: versao
        shell: bash
        run: |
          # A tag manda: quem baixa precisa que 'pp-lint --version' diga a mesma
          # coisa que a página da release. Sem tag (workflow_dispatch), fica o
          # valor do Directory.Build.props.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "arg=-p:Version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "arg=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar binário
        run: >
          dotnet publish src/PpLint.Cli
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          ${{ steps.versao.outputs.arg }}
          --output publish

      - name: Renomear e gerar checksum
        shell: bash
        run: |
          mkdir -p artifacts
          cp "publish/${{ matrix.binary }}" "artifacts/${{ matrix.asset }}"
          cd artifacts

          # O Git Bash do Windows traz sha256sum e não traz shasum; o macOS traz
          # shasum e não traz sha256sum. Escolher em tempo de execução é o que
          # faz o mesmo passo servir às três plataformas.
          if command -v sha256sum > /dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

          cat "${{ matrix.asset }}.sha256"

      - name: Verificar que o catálogo sobreviveu à publicação
        shell: bash
        run: |
          # As regras são descobertas por reflexão; se o publish removesse os
          # tipos, 'rules' viria vazio e o binário seria inútil na prática.
          count=$(./publish/${{ matrix.binary }} rules | wc -l)
          echo "regras no binário publicado: $count"
          # O número real do catálogo. Com um limiar frouxo, um publish que
          # removesse tipos por trimming deixaria o binário rodando e inútil,
          # e esta verificação passaria assim mesmo.
          test "$count" -ge 60

      - name: Verificar que a documentação embarcada sobreviveu
        shell: bash
        run: |
          # Os documentos de regra viajam como recurso embarcado. Se o publish
          # os perdesse, 'explain' e o campo help do SARIF sairiam vazios.
          ./publish/${{ matrix.binary }} explain NM040 | grep -q "O que pega"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
